# Petite instance : peu de processus (l EC2 partage la memoire avec le serveur de mail)
<IfModule mpm_prefork_module>
  StartServers 1
  MinSpareServers 1
  MaxSpareServers 2
  MaxRequestWorkers 6
  MaxConnectionsPerChild 500
</IfModule>
ServerTokens Prod
ServerSignature Off
# Caddy termine le HTTPS : on fait confiance a son X-Forwarded-*
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
SetEnvIf X-Forwarded-Proto https HTTPS=on
<DirectoryMatch "^/var/www/html/(install|dev|build|doc)/">
  Require all denied
</DirectoryMatch>
